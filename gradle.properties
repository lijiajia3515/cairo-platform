kotlin.stdlib.default.dependency=false

# gradle config
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Dfile.encoding=UTF-8
# 依赖下载走国内镜像优先（见 gradle/repository.gradle），连接/读取超时防止卡死
org.gradle.internal.http.connectionTimeout=15000
org.gradle.internal.http.socketTimeout=60000

# 项目配置
# 全仓统一版本：开发期用 Maven 标准 -SNAPSHOT；发布时去掉后缀或 CI 上 -Pversion 覆盖
version=2.2.0-SNAPSHOT

# 发布仓库（暂未配置：后续切换到 Maven Central / 其他私服时，
# 在 ~/.gradle/gradle.properties 中配置 repository.* 凭证与 publishRepository 即可，
# 发布逻辑见 gradle/publish.gradle，本仓库不再保存任何凭证）

# java
javaVersion=17

# dependencies
springBootVersion=3.5.16
springCloudVersion=2025.0.3
springBootAdminVersion=3.5.9
hutoolVersion=5.8.38
