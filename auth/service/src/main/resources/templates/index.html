<!doctype html>
<!-- 账号首页(已登录展示账号信息,未登录引导去登录)。
     色板/顶栏/页脚来自 fragments.html;契约:th:if="${account}" 两分支、登出 form POST @{/logout}。 -->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="fragments :: common-head('Cairo账号')"></th:block>
  <style>
    .profile {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 4px 0 24px;
      border-bottom: 1px solid var(--line);
    }
    .avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--line);
    }
    .avatar-fallback {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: var(--brand-light);
      color: var(--brand);
      font-size: 24px; font-weight: 600;
      display: flex; align-items: center; justify-content: center;
    }
    .profile-name { font-size: 18px; font-weight: 600; word-break: break-all; }
    .profile-sub { margin-top: 6px; font-size: 13px; color: var(--text-3); }

    .info-list { margin-top: 4px; }
    .info-row {
      display: flex;
      padding: 13px 0;
      border-bottom: 1px solid var(--line);
      font-size: 14px;
    }
    .info-row dt { width: 72px; flex: none; color: var(--text-3); }
    .info-row dd { flex: 1; color: var(--text-1); word-break: break-all; }

    .details { margin-top: 16px; font-size: 13px; }
    .details summary { cursor: pointer; color: var(--text-3); user-select: none; }
    .details summary:hover { color: var(--text-2); }
    .details pre {
      margin-top: 8px;
      padding: 12px;
      background: #f7f8fa;
      border: 1px solid var(--line);
      border-radius: 4px;
      font-size: 12px;
      line-height: 1.6;
      max-height: 260px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .actions { margin-top: 24px; }

    .empty-card { text-align: center; padding: 32px 0 24px; font-size: 14px; color: var(--text-2); }
  </style>
</head>
<body>

<header class="topbar" th:replace="fragments :: topbar"></header>

<main class="main">
  <div class="card">

    <!-- 已登录:账号信息 -->
    <div th:if="${account}">
      <div class="profile">
        <img class="avatar" th:if="${account.avatarUrl}" th:src="${account.avatarUrl}"
             src="/static/logo.svg" alt="头像"/>
        <div class="avatar-fallback" th:if="${account.avatarUrl == null}">C</div>
        <div>
          <div class="profile-name" th:text="${account.nickname ?: account.loginname}">用户</div>
          <div class="profile-sub">账号ID:&nbsp;<span th:text="${account.accountId} ?: '未知'">Root</span></div>
        </div>
      </div>

      <dl class="info-list">
        <div class="info-row">
          <dt>昵称</dt>
          <dd th:text="${account.nickname}?:'未设置'">昵称</dd>
        </div>
        <div class="info-row">
          <dt>登录名</dt>
          <dd th:text="${account.loginname}?:'未知'">default</dd>
        </div>
        <div class="info-row">
          <dt>邮箱</dt>
          <dd th:text="${account.email}?:'未绑定'">Email</dd>
        </div>
        <div class="info-row">
          <dt>手机号</dt>
          <dd th:text="${account.phoneNumber}?:'未绑定'">138****0000</dd>
        </div>
        <div class="info-row">
          <dt>会话ID</dt>
          <dd th:text="${account.id}?:'未知'">account_0</dd>
        </div>
      </dl>

      <details class="details">
        <summary>调试信息(认证对象)</summary>
        <pre th:text="${account}">CairoAuthAccount</pre>
      </details>

      <form class="actions" th:action="@{/logout}" action="/logout" method="post">
        <button type="submit" class="btn btn-danger-outline btn-block">退出登录</button>
      </form>
    </div>

    <!-- 未登录:引导去登录 -->
    <div class="empty-card" th:if="${account == null}">
      当前无登录用户,登录请 <a class="link" href="/login">前往登录</a>
    </div>

  </div>
</main>

<footer class="footer" th:replace="fragments :: footer"></footer>

</body>
</html>
