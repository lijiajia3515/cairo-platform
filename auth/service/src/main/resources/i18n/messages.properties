# ============================================================
# 一、Spring Security 标准消息
# ============================================================
AbstractAccessDecisionManager.accessDenied=权限不足
AbstractSecurityInterceptor.authenticationNotFound=SecurityContext中未找到Authentication对象

AbstractUserDetailsAuthenticationProvider.emptyCredentials=密码不能为空
AbstractUserDetailsAuthenticationProvider.badCredentials=密码错误
AbstractUserDetailsAuthenticationProvider.credentialsExpired=密码已过期
AbstractUserDetailsAuthenticationProvider.locked=账号已锁定
AbstractUserDetailsAuthenticationProvider.disabled=账号已禁用
AbstractUserDetailsAuthenticationProvider.expired=登录已过期
AbstractUserDetailsAuthenticationProvider.onlySupports=只支持UsernamePasswordAuthenticationToken
AccountStatusUserDetailsChecker.locked=账号已锁定
AccountStatusUserDetailsChecker.disabled=账号已禁用
AccountStatusUserDetailsChecker.expired=账号已过期
AccountStatusUserDetailsChecker.credentialsExpired=密码已过期
AnonymousAuthenticationProvider.incorrectKey=呈现的AnonymousAuthenticationToken不包含预期的key
DigestAuthenticationFilter.incorrectResponse=响应错误
DigestAuthenticationFilter.nonceExpired=Nonce已过期/超时
ExceptionTranslationFilter.insufficientAuthentication=访问此资源需要完全认证
PersistentTokenBasedRememberMeServices.cookieStolen=记住我令牌无效(Series/Token不匹配)，可能存在Cookie被盗风险
RememberMeAuthenticationProvider.incorrectKey=呈现的RememberMeAuthenticationToken不包含预期的key
RunAsImplAuthenticationProvider.incorrectKey=呈现的RunAsUserToken不包含预期的key
SwitchUserFilter.noCurrentUser=当前请求未关联用户
SwitchUserFilter.noOriginalAuthentication=未找到原始用户

