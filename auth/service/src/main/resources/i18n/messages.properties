CairoAccountSnsCodeAuthenticationProvider.onlySupports=只支持CairoAccountSnsCodeAuthenticationToken类型
CairoAccountVerifyCodeAuthenticationProvider.emptyVerifyCode=验证码不能为空
CairoAccountVerifyCodeAuthenticationProvider.badVerifyCode=验证码错误
CairoAccountVerifyCodeAuthenticationProvider.onlySupports=只支持CairoAccountVerifyCodeAuthenticationToken类型
CairoAppUserAccountAuthenticationProvider.onlySupports=只支持CairoAppUserAccountAuthenticationToken类型
CairoAppUserPasswordAuthenticationProvider.onlySupports=只支持CairoAppUserPasswordAuthenticationToken类型
CairoAppUserAccountSnsCodeAuthenticationProvider.onlySupports=只支持CairoAppUserAccountSnsCodeAuthenticationToken类型
CairoAppUserVerifyCodeAuthenticationProvider.emptyVerifyCode=验证码不能为空
CairoAppUserVerifyCodeAuthenticationProvider.badVerifyCode=验证码错误
CairoAppUserVerifyCodeAuthenticationProvider.onlySupports=只支持CairoAppUserVerifyCodeAuthenticationToken类型
CairoTenantAppUserPasswordAuthenticationProvider.onlySupports=只支持CairoTenantAppUserPasswordAuthenticationToken类型
CairoTenantAppUserAccountAuthenticationProvider.onlySupports=只支持CairoTenantAppUserAccountAuthenticationToken类型
CairoTenantAppUserVerifyCodeAuthenticationProvider.emptyVerifyCode=验证码不能为空
