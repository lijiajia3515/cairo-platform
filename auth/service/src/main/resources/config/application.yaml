server:
  port: 80
  http2:
    enabled: true
  max-http-request-header-size: 8KB
  servlet:
    encoding:
      force: true
    session:
      cookie:
        name: cairo
        path: /
        max-age: 30M
  tomcat:
    max-http-form-post-size: 10MB
  error:
    include-exception: true
    include-binding-errors: always
    include-message: always
    include-stacktrace: on_param
  shutdown: graceful

management:
  metrics:
    mongo:
      command:
        enabled: false
      connectionpool:
        enabled: false
  tracing:
    enabled: true
    sampling:
      probability: 1
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans

arthas:
  app-name: ${spring.application.name}
  agent-id: ${spring.application.name}-${spring.cloud.client.hostname:${random.uuid}}

logging:
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      file-name-pattern: "logs/%d{yyyy-MM}/app-%d{yyyy-MM-dd-HH-mm}.%i.log.gz"
      max-file-size: 20MB
      max-history: 30
      clean-history-on-start: false

  level:
    root: info
    org.springframework.data.mongodb: warn
    org.springframework.data.redis: warn



resilience4j:
  # 限时策略
  timelimiter:
    configs:
      default:
        timeout-duration: 30s
  # 限流策略
  ratelimiter:
    instances:
      default:
        register-health-indicator: true
  # 重试策略
  retry:
    configs:
      # 默认配置
      default:
        # 表示最大重试次数
        max-attempts: 3
        # 下一次重试等待时间，最小为100 ms
        wait-duration: 100ms
        # 重试事件缓冲区大小
        event-consumer-buffer-size: 1
        # 示下次重试的时间间隔是否随机， enableRandomizedWait 和 enableExponentialBackoff 默认为 false ，并且这两个不可以同时开启
        enable-randomized-wait: false
        # 时间间隔乘数
        exponentialBackoffMultiplier: 2
        # 需要重试的异常
        retry-exceptions:
          - java.io.IOException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - io.github.lijiajia3515.cairo.feign.error.ErrorFeignException
        ignore-exceptions:
          - io.github.lijiajia3515.cairo.feign.error.RequestFeignException
  # 熔断策略
  circuitbreaker:
    configs:
      # 默认配置
      default:
        # 最低调用次数
        minimum-number-of-calls: 100
        # 失败比率(超过50%断路器打开)
        failure-rate-threshold: 50
        # 断路器开启到半开时间（也就是保护服务时间）
        wait-duration-in-open-state: 30s
        # 半开允许调用次数
        permitted-number-of-calls-in-half-open-state: 10
        # 滑动窗口类型;计数器方式
        sliding-window-type: count_based
        # 开启到半开状态自动完成无需尝试触发调用次数
        automatic-transition-from-open-to-half-open-enabled: true
        # 记录事件缓存池大小
        event-consumer-buffer-size: 100
        # 注册到健康检查指标
        register-health-indicator: true
        # 是否将失败反馈到health健康指标中
        allow-health-indicator-to-fail: false
        # 需要记录的异常
        record-exceptions:
          - java.lang.RuntimeException
          - java.io.IOException
          - java.net.ConnectException
          - java.util.concurrent.TimeoutException
          - org.springframework.web.client.HttpServerErrorException
          - io.github.lijiajia3515.cairo.feign.error.ErrorFeignException
        # 需要忽略的异常
        ignore-exceptions:
          - io.github.lijiajia3515.cairo.feign.error.RequestFeignException

ip2region:
  # 数据库下载链接 https://github.com/lionsoul2014/ip2region
  db-path: "/cairo/auth/ip2region/ip2region.xdb"

cairo:
  auth:
    oauth2:
      issuer: http://cairo-auth
      rsa-keys:
        - id: default
          private-key: ${CAIRO_OAUTH2_RSA_PRIVATE_KEY:your-base64-private-key}
          public-key: ${CAIRO_OAUTH2_RSA_PUBLIC_KEY:your-base64-public-key}
    auto-register: true
    default-avatar-url: /avatar/default.png
    client:
      client-registration-id: cairo-auth-service
  security:
    cairo-app-id: cairo
    portal-app-id: portal
    manage-subapp-id: manage
  redis:
    key-prefix: "cairo:${spring.application.name:${random.uuid}}:"
  rabbitmq:
    exchange:
      auth:
        name: auth
      biz_log:
        name: biz_log
    route-key:
      auth:
        prefix: "auth."
      biz_log:
        prefix: "biz_log."
    queue:
      prefix: "auth."
  xxljob:
    admin-address: http://xxljob
    access-token: ""


lock4j:
  acquire-timeout: 3000 #默认值3s，可不设置
  expire: 30000 #默认值30s，可不设置
  primary-executor: com.baomidou.lock.executor.RedissonLockExecutor #默认redisson>redisTemplate>zookeeper，可不设置
  lock-key-prefix: ${cairo.redis.key-prefix}lock4j #锁key前缀, 默认值lock4j，可不设置
  primary-failure-strategy: io.github.lijiajia3515.cairo.auth.framework.lock4j.CairoLockFailureStrategy
  primary-key-builder: com.baomidou.lock.DefaultLockKeyBuilder

