spring:
  application:
    name: cairo-auth-service
    instance_id: ${spring.cloud.client.hostname:${spring.cloud.client.ip-address:${random.uuid}}}
  lifecycle:
    timeout-per-shutdown-phase: 3m
  messages:
    basename: i18n/messages
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    locale: zh_CN
    default-property-inclusion: NON_EMPTY
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      WRITE_DATE_KEYS_AS_TIMESTAMPS: false
      WRITE_DATES_WITH_ZONE_ID: false
    deserialization:
      ADJUST_DATES_TO_CONTEXT_TIME_ZONE: false
    generator:
      WRITE_NUMBERS_AS_STRINGS: true
  mvc:
    static-path-pattern: /static/**
    throw-exception-if-no-handler-found: true
    format:
      date: yyyy-MM-dd
      time: HH:mm:ss
      date-time: yyyy-MM-dd HH:mm:ss
    pathmatch:
      matching-strategy: path_pattern_parser
  web:
    locale: zh_CN
    locale-resolver: accept_header
  webflux:
    format:
      date: yyyy-MM-dd
      date-time: yyyy-MM-dd HH:mm:ss
  thymeleaf:
    cache: true
  servlet:
    multipart:
      max-request-size: 10MB
      max-file-size: 100MB
      file-size-threshold: 1MB
      resolve-lazily: true
  session:
    timeout: 7D
    redis:
      save-mode: on_get_attribute
      flush-mode: on_save
      repository-type: INDEXED
      namespace: '${cairo.redis.key-prefix}session'
      cleanup-cron: 0 * * * * *
  cache:
    type: redis
    redis:
      key-prefix: "cairo:${spring.application.name:${random.uuid}}"
      time-to-live: 2H
      enable-statistics: true
  task:
    execution:
      pool:
        max-size: 100
        queue-capacity: 1000
      shutdown:
        await-termination: true
        await-termination-period: 10m
    scheduling:
      pool:
        size: 10
      shutdown:
        await-termination: true
        await-termination-period: 10m
  security:
    oauth2:
      client:
        registration:
          cairo-auth-service:
            provider: CAIRO
            client-id: ${cairo.auth.client.client-id:default_client_id}
            client-secret: ${cairo.auth.client.client-secret:default_client_secret}
            client-authentication-method: client_secret_post
            authorization-grant-type: client_credentials
            client-name: ${cairo.auth.client.client-name:default-client}
            scope:
              - sms_message:send_message_by_phone_number
              - sms_message:send_message_by_account
              - sys_dict:read
              - public_file:upload_file
              - public_file:delete_file
              - temporary_file:upload_file
          wechat-web:
            provider: WECHAT-WEB
            client-name: 微信
            client-id: ${CAIRO_SNS_WECHAT_WEB_CLIENT_ID:your-wechat-web-appid}
            client-secret: ${CAIRO_SNS_WECHAT_WEB_CLIENT_SECRET:your-secret}
            client-authentication-method: basic
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - snsapi_login
          wechat-open:
            provider: WECHAT-OPEN
            client-name: 微信
            client-id: ${CAIRO_SNS_WECHAT_OPEN_CLIENT_ID:your-wechat-open-appid}
            client-secret: ${CAIRO_SNS_WECHAT_OPEN_CLIENT_SECRET:your-secret}
            client-authentication-method: basic
            authorization-grant-type: authorization_code
            redirect-uri: '{baseUrl}/login/oauth2/code/{registrationId}'
            scope:
              - snsapi_userinfo
          github:
            provider: GITHUB
            client-id: ${CAIRO_SNS_GITHUB_CLIENT_ID:your-github-client-id}
            client-secret: ${CAIRO_SNS_GITHUB_CLIENT_SECRET:your-secret}
            client-name: Github
          google:
            provider: GOOGLE
            client-id: ${CAIRO_SNS_GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${CAIRO_SNS_GOOGLE_CLIENT_SECRET:your-secret}
            client-name: Google
        provider:
          CAIRO:
            authorization-uri: ${cairo.auth.server-url:http://cairo-auth-server}
            token-uri: ${cairo.auth.server-url:http://cairo-auth-server}/oauth2/token
            jwk-set-uri: ${cairo.auth.server-url:http://cairo-auth-server}/oauth2/jwks
          WECHAT-WEB:
            authorization-uri: https://open.weixin.qq.com/connect/qrconnect?appid=${CAIRO_SNS_WECHAT_WEB_CLIENT_ID:your-wechat-web-appid}
            token-uri: https://api.weixin.qq.com/sns/oauth2/access_token
            user-info-uri: https://api.weixin.qq.com/sns/userinfo
            user-info-authentication-method: form
            user-name-attribute: unionid
          WECHAT-OPEN:
            authorization-uri: https://open.weixin.qq.com/connect/oauth2/authorize?appid=${CAIRO_SNS_WECHAT_OPEN_CLIENT_ID:your-wechat-open-appid}
            token-uri: https://api.weixin.qq.com/sns/oauth2/access_token
            user-info-uri: https://api.weixin.qq.com/sns/userinfo
            user-info-authentication-method: form
            user-name-attribute: unionid

  data:
    redis:
      database: 0
      connect-timeout: 10s
      timeout: 1m
      lettuce:
        shutdown-timeout: 1m
        pool:
          max-active: 5
          max-idle: 5
          min-idle: 1
          max-wait: 1m
          time-between-eviction-runs: 10m
        cluster:
          refresh:
            adaptive: true
            period: 15s
  rabbitmq:
    dynamic: true
    publisher-confirm-type: correlated
    listener:
      type: direct
      direct:
        auto-startup: true
        missing-queues-fatal: true
        consumers-per-queue: 1
        acknowledge-mode: manual
        prefetch: 5
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 3
      simple:
        auto-startup: true
        missing-queues-fatal: true
        consumer-batch-enabled: true
        acknowledge-mode: manual
        prefetch: 5
        concurrency: 10
        max-concurrency: 10
        batch-size: 10
        retry:
          enabled: true
          initial-interval: 2s
          multiplier: 2
          max-attempts: 3
  cloud:
    loadbalancer:
      enabled: true
      cache:
        ttl: 30s
        capacity: 128
        caffeine:
          spec: initialCapacity=128, maximumSize=1024, expireAfterWrite=30s
      retry:
        enabled: true
        retry-on-all-operations: true
        max-retries-on-same-service-instance: 1
        max-retries-on-next-service-instance: 2
        retryable-status-codes:
          - 408
          - 449
          - 502
          - 503
          - 504
          - 509
          - 599
        backoff:
          enabled: true
          min-backoff: 100
          max-backoff: 10000
          jitter: 2
      clients:
        default:
          retry:
            enabled: true
            retry-on-all-operations: true
            max-retries-on-same-service-instance: 0
            max-retries-on-next-service-instance: 2
            retryable-status-codes:
              - 408
              - 449
              - 502
              - 503
              - 504
              - 509
              - 599
            backoff:
              enabled: true
              min-backoff: 1s
              max-backoff: 10s
              jitter: 2
      stats:
        micrometer:
          enabled: true
    consul:
      host: consul
      port: 8500
      discovery:
        instance-zone: default
        instance-group: cairo
        tags:
          - cairo
          - service
        metadata:
          management_port: ${management.server.port:9000}
        management-tags:
          - cairo
        query-passing: true
        prefer-ip-address: true
        health-check-path: /actuator/health/liveness
    openfeign:
      autoconfiguration:
        jackson:
          enabled: true
      okhttp:
        enabled: true
      httpclient:
        connection-timeout: 3000
        ok-http:
          read-timeout: 30s
      compression:
        request:
          enabled: true
          min-request-size: 204000
        response:
          enabled: true
      client:
        refresh-enabled: true
        default-to-properties: true
        default-config: default
        config:
          default:
            logger-level: HEADERS
            connect-timeout: 3000
            read-timeout: 30000
            follow-redirects: true
            exception-propagation-policy: unwrap
      circuitbreaker:
        enabled: true
        group:
          enabled: true
      micrometer:
        enabled: true
      oauth2:
        enabled: false

        clientRegistrationId: cairo-auth-service


